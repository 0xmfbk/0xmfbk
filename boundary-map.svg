<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Trust-boundary research map</title><desc id="desc">A conceptual map linking application, identity, cloud infrastructure, container runtime, and kernel/eBPF layers.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#a3e635"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#67e8f9" stroke-opacity=".06"/></pattern>
</defs>
<rect width="1100" height="390" rx="18" fill="url(#back)"/><rect width="1100" height="390" rx="18" fill="url(#grid)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
 <text x="36" y="42" fill="#67e8f9" font-size="12" letter-spacing="2">RESEARCH MAP / 01</text><text x="36" y="69" fill="#f1f5f9" font-size="22" font-weight="700">Where trust changes hands</text><text x="36" y="92" fill="#94a3b8" font-size="12">A conceptual lens — not a claim about a specific system.</text>
 <path d="M140 190H960" stroke="url(#edge)" stroke-width="2" stroke-dasharray="5 7" opacity=".85"/>
 <g transform="translate(45 135)"><rect width="170" height="112" rx="12" fill="#0c1f2b" stroke="#155e75"/><rect x="0" y="0" width="170" height="4" rx="2" fill="#67e8f9"/><text x="16" y="32" fill="#67e8f9" font-size="11">LAYER 01</text><text x="16" y="58" fill="#f8fafc" font-size="16" font-weight="700">Application</text><text x="16" y="82" fill="#94a3b8" font-size="11">Inputs · logic · APIs</text><text x="16" y="98" fill="#64748b" font-size="10">What is trusted?</text></g>
 <g transform="translate(265 135)"><rect width="170" height="112" rx="12" fill="#111c2d" stroke="#365078"/><rect x="0" y="0" width="170" height="4" rx="2" fill="#38bdf8"/><text x="16" y="32" fill="#7dd3fc" font-size="11">LAYER 02</text><text x="16" y="58" fill="#f8fafc" font-size="16" font-weight="700">Identity</text><text x="16" y="82" fill="#94a3b8" font-size="11">Auth · permissions</text><text x="16" y="98" fill="#64748b" font-size="10">Who can do what?</text></g>
 <g transform="translate(485 135)"><rect width="170" height="112" rx="12" fill="#171b2b" stroke="#6d4b8f"/><rect x="0" y="0" width="170" height="4" rx="2" fill="#e879f9"/><text x="16" y="32" fill="#e879f9" font-size="11">LAYER 03</text><text x="16" y="58" fill="#f8fafc" font-size="16" font-weight="700">Infrastructure</text><text x="16" y="82" fill="#94a3b8" font-size="11">Cloud · network</text><text x="16" y="98" fill="#64748b" font-size="10">Where does it run?</text></g>
 <g transform="translate(705 135)"><rect width="170" height="112" rx="12" fill="#172319" stroke="#4d7c0f"/><rect x="0" y="0" width="170" height="4" rx="2" fill="#a3e635"/><text x="16" y="32" fill="#bef264" font-size="11">LAYER 04</text><text x="16" y="58" fill="#f8fafc" font-size="16" font-weight="700">Container Runtime</text><text x="16" y="82" fill="#94a3b8" font-size="11">Isolation · policy</text><text x="16" y="98" fill="#64748b" font-size="10">What is contained?</text></g>
 <g transform="translate(925 135)"><rect width="140" height="112" rx="12" fill="#201a2a" stroke="#9d4edd"/><rect x="0" y="0" width="140" height="4" rx="2" fill="#c084fc"/><text x="14" y="32" fill="#d8b4fe" font-size="11">LAYER 05</text><text x="14" y="58" fill="#f8fafc" font-size="16" font-weight="700">Kernel / eBPF</text><text x="14" y="82" fill="#94a3b8" font-size="11">Runtime boundary</text><text x="14" y="98" fill="#64748b" font-size="10">What enforces it?</text></g>
 <g><circle cx="243" cy="190" r="11" fill="#07111d" stroke="#67e8f9" stroke-width="2"/><path d="M239 190l3 3 6-7" fill="none" stroke="#67e8f9" stroke-width="1.5"/><circle cx="463" cy="190" r="11" fill="#07111d" stroke="#38bdf8" stroke-width="2"/><path d="M459 190l3 3 6-7" fill="none" stroke="#38bdf8" stroke-width="1.5"/><circle cx="683" cy="190" r="11" fill="#07111d" stroke="#e879f9" stroke-width="2"/><path d="M679 190l3 3 6-7" fill="none" stroke="#e879f9" stroke-width="1.5"/><circle cx="903" cy="190" r="11" fill="#07111d" stroke="#a3e635" stroke-width="2"/><path d="M899 190l3 3 6-7" fill="none" stroke="#a3e635" stroke-width="1.5"/></g>
 <rect x="36" y="286" width="1028" height="57" rx="10" fill="#0a1724" stroke="#24384b"/><text x="56" y="309" fill="#a3e635" font-size="11" letter-spacing="1.5">THE QUESTION</text><text x="56" y="329" fill="#cbd5e1" font-size="13">Does the security assumption hold when context crosses a boundary?</text><text x="1039" y="321" fill="#64748b" font-size="10" text-anchor="end">MODEL -&gt; TEST -&gt; LEARN</text>
</g><rect x="1" y="1" width="1098" height="388" rx="17" fill="none" stroke="#365066" stroke-opacity=".8"/>
</svg>
