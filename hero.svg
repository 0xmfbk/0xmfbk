<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Mustafa Bani Khalaf, security researcher. A probe repeatedly hits a container boundary." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140E2B"/><stop offset="1" stop-color="#26123A"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#FFB38A"/><stop offset="1" stop-color="#FF6A3D"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <clipPath id="r1"><rect x="64" y="150" width="0" height="46"><animate attributeName="width" from="0" to="620" dur="1.6s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="r2"><rect x="64" y="262" width="0" height="30"><animate attributeName="width" from="0" to="640" dur="1.8s" begin="2s" fill="freeze"/></rect></clipPath>
    <clipPath id="r3"><rect x="64" y="302" width="0" height="30"><animate attributeName="width" from="0" to="640" dur="1.8s" begin="3.6s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>

  <!-- boundary scene -->
  <g transform="translate(0,0)">
    <circle cx="920" cy="220" r="176" fill="none" stroke="#7C6BD6" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 920 220" to="360 920 220" dur="60s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="220" r="128" fill="none" stroke="#C9A7FF" stroke-width="2.5" stroke-dasharray="46 14 6 14">
      <animateTransform attributeName="transform" type="rotate" from="360 920 220" to="0 920 220" dur="40s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="220" r="128" fill="none" stroke="#C9A7FF" stroke-width="1" opacity=".5">
      <animate attributeName="r" values="128;134;128" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;.05;.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="220" r="70" fill="none" stroke="#FF8A5B" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="920" cy="220" r="26" fill="url(#core)">
      <animate attributeName="r" values="24;29;24" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="920" y="225" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#2A0F12">kernel</text>
    <text x="920" y="62" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#9C8FE0">application</text>
    <text x="920" y="104" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#C9A7FF">container boundary</text>

    <!-- probe: travels in, hits the membrane, returns -->
    <circle r="6" fill="#BDEBFF">
      <animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0" keyTimes="0;0.5;1" path="M1130,220 L1049,220"/></circle>
    <circle cx="1048" cy="220" r="4" fill="none" stroke="#BDEBFF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="4;4;30;30" keyTimes="0;0.5;0.72;1" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.52;0.75;1" dur="4.4s" repeatCount="indefinite"/></circle>
    <text x="1130" y="206" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#BDEBFF" opacity=".8">assumption under test</text>
  </g>

  <!-- copy -->
  <text x="64" y="118" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#9C8FE0">0xmfbk / security research lab</text>
  <g clip-path="url(#r1)">
    <text x="64" y="190" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="56" font-weight="700" fill="#F6F0FF">Mustafa Bani Khalaf</text>
  </g>
  <g clip-path="url(#r2)">
    <text x="64" y="284" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#FFB38A">I test the assumptions between systems.</text>
  </g>
  <g clip-path="url(#r3)">
    <text x="64" y="324" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#BDEBFF">eBPF / containers / kernel / agentic security</text>
  </g>
  <rect x="64" y="350" width="10" height="20" fill="#FF8A5B"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="86" y="366" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#7C6BD6">instructor @ CyberA4U  /  learning Rust</text>
</svg>
