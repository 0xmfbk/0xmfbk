<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Six areas of work: offensive security, defensive and SOC, DevSecOps and automation, governance and assurance, infrastructure, teaching and community." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140E2B"/><stop offset="1" stop-color="#26123A"/></linearGradient></defs><rect width="1200" height="520" rx="24" fill="url(#bg)"/><rect x="40" y="30" width="360" height="226" rx="18" fill="#7C6BD6" fill-opacity=".10" stroke="#7C6BD6" stroke-opacity=".35"/>
<rect x="40" y="30" width="360" height="226" rx="18" fill="none" stroke="#FF8A5B" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.14;.17;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect>
<text x="64" y="82" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-weight="700" fill="#F6F0FF">Offensive security</text>
<g transform="translate(356 72)"><circle r="12" fill="none" stroke="#FFB38A" stroke-width="2"/><path d="M-18 0H-6M6 0H18M0 -18V-6M0 6V18" stroke="#FFB38A" stroke-width="2"/><circle r="2.5" fill="#FF6A3D"><animate attributeName="r" values="2;4;2" dur="1.6s" repeatCount="indefinite"/></circle></g><text x="64" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Web application pentesting and the</text><text x="64" y="149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">OWASP Top 10. Internal and external</text><text x="64" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">network pentesting. Ethical hacking</text><text x="64" y="195" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">methodologies, plus vulnerability</text><text x="64" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">assessment and mitigation.</text>
<rect x="420" y="30" width="360" height="226" rx="18" fill="#7C6BD6" fill-opacity=".10" stroke="#7C6BD6" stroke-opacity=".35"/>
<rect x="420" y="30" width="360" height="226" rx="18" fill="none" stroke="#FF8A5B" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.14;.17;1" dur="12s" begin="2s" repeatCount="indefinite"/></rect>
<text x="444" y="82" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-weight="700" fill="#F6F0FF">Defensive and SOC</text>
<g transform="translate(736 72)"><circle r="4" fill="#BDEBFF"/><circle r="8" fill="none" stroke="#BDEBFF" stroke-width="2"><animate attributeName="r" values="8;18;18" keyTimes="0;.8;1" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;0" keyTimes="0;.8;1" dur="2.4s" repeatCount="indefinite"/></circle><circle r="16" fill="none" stroke="#BDEBFF" stroke-opacity=".35" stroke-width="2"/></g><text x="444" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Log analysis in Splunk, threat</text><text x="444" y="149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">monitoring, detection and incident</text><text x="444" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">response. SIEM workflows, learned in</text><text x="444" y="195" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">a 120-hour SOC track with Green</text><text x="444" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Circle for Cybersecurity.</text>
<rect x="800" y="30" width="360" height="226" rx="18" fill="#7C6BD6" fill-opacity=".10" stroke="#7C6BD6" stroke-opacity=".35"/>
<rect x="800" y="30" width="360" height="226" rx="18" fill="none" stroke="#FF8A5B" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.14;.17;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect>
<text x="824" y="82" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-weight="700" fill="#F6F0FF">DevSecOps and automation</text>
<g transform="translate(1116 72)"><path d="M-14 0C-14 -10 -2 -10 0 0C2 10 14 10 14 0C14 -10 2 -10 0 0C-2 10 -14 10 -14 0Z" fill="none" stroke="#C9A7FF" stroke-width="2.5" stroke-dasharray="14 8"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2s" repeatCount="indefinite"/></path></g><text x="824" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Security scripting in Python, Bash</text><text x="824" y="149" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">and PowerShell. Git and GitHub.</text><text x="824" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">CI/CD-integrated security practices.</text><text x="824" y="195" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Agentic automation with AI, kept</text><text x="824" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">measurable and human-reviewable.</text>
<rect x="40" y="280" width="360" height="226" rx="18" fill="#7C6BD6" fill-opacity=".10" stroke="#7C6BD6" stroke-opacity=".35"/>
<rect x="40" y="280" width="360" height="226" rx="18" fill="none" stroke="#FF8A5B" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.14;.17;1" dur="12s" begin="6s" repeatCount="indefinite"/></rect>
<text x="64" y="332" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-weight="700" fill="#F6F0FF">Governance and assurance</text>
<g transform="translate(356 322)"><path d="M0 -16L12 -10V3C12 10 6 14 0 17C-6 14 -12 10 -12 3V-10Z" fill="none" stroke="#FFB38A" stroke-width="2"/><path d="M-5 1L-1 5L6 -4" fill="none" stroke="#BDEBFF" stroke-width="2.5"/></g><text x="64" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Lead auditor certifications in ISO/IEC</text><text x="64" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">27001:2022, 27701:2025 and 42001:2023</text><text x="64" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">(June 2026). ISC2 Certified in</text><text x="64" y="445" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Cybersecurity (CC). Reports that turn</text><text x="64" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">findings into business-ready action.</text>
<rect x="420" y="280" width="360" height="226" rx="18" fill="#7C6BD6" fill-opacity=".10" stroke="#7C6BD6" stroke-opacity=".35"/>
<rect x="420" y="280" width="360" height="226" rx="18" fill="none" stroke="#FF8A5B" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.14;.17;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect>
<text x="444" y="332" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-weight="700" fill="#F6F0FF">Infrastructure</text>
<g transform="translate(736 322)"><rect x="-14" y="-16" width="28" height="9" rx="2" fill="none" stroke="#C9A7FF" stroke-width="2"/><circle cx="8" cy="-11.5" r="1.8" fill="#BDEBFF"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle><rect x="-14" y="-4" width="28" height="9" rx="2" fill="none" stroke="#C9A7FF" stroke-width="2"/><circle cx="8" cy="0.5" r="1.8" fill="#BDEBFF"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><rect x="-14" y="8" width="28" height="9" rx="2" fill="none" stroke="#C9A7FF" stroke-width="2"/><circle cx="8" cy="12.5" r="1.8" fill="#BDEBFF"><animate attributeName="opacity" values="1;.2;1" dur="2.0s" repeatCount="indefinite"/></circle></g><text x="444" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Windows and Linux server admin,</text><text x="444" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">hardening, and access control (IAM).</text><text x="444" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Virtualization with Proxmox VE, VMware,</text><text x="444" y="445" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">QEMU and VirtualBox. Network labs in</text><text x="444" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">GNS3 and Cisco Packet Tracer.</text>
<rect x="800" y="280" width="360" height="226" rx="18" fill="#7C6BD6" fill-opacity=".10" stroke="#7C6BD6" stroke-opacity=".35"/>
<rect x="800" y="280" width="360" height="226" rx="18" fill="none" stroke="#FF8A5B" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.14;.17;1" dur="12s" begin="10s" repeatCount="indefinite"/></rect>
<text x="824" y="332" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-weight="700" fill="#F6F0FF">Teaching and community</text>
<g transform="translate(1116 322)"><path d="M-11 8L0 -10L11 8Z" fill="none" stroke="#C9A7FF" stroke-width="1.5"/><g fill="#FFB38A"><circle cx="-11" cy="8" r="4"/><circle cx="11" cy="8" r="4"/><circle cx="0" cy="-10" r="4"><animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/></circle></g></g><text x="824" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Cybersecurity instructor at CyberA4U.</text><text x="824" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Founded DSC YU; technical director of</text><text x="824" y="422" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">GDSC YU. Mentored 50+ students. Tech</text><text x="824" y="445" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">team lead at the Jordanian Tarabot</text><text x="824" y="468" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Initiative, running hands-on workshops.</text>
</svg>