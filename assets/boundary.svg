<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Packets fall through application, container and kernel layers; two are stopped at boundaries, one passes and is observed." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140E2B"/><stop offset="1" stop-color="#1F1236"/></linearGradient></defs>
  <style>text{font-family:ui-monospace,Menlo,Consolas,monospace}</style>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <!-- layers -->
  <rect x="150" y="30" width="1020" height="96" rx="12" fill="#7C6BD6" fill-opacity=".12"/>
  <rect x="150" y="134" width="1020" height="96" rx="12" fill="#C9A7FF" fill-opacity=".12"/>
  <rect x="150" y="238" width="1020" height="96" rx="12" fill="#FF8A5B" fill-opacity=".14"/>
  <text x="36" y="84" font-size="15" fill="#B8ADF0">application</text>
  <text x="36" y="188" font-size="15" fill="#D9C2FF">container runtime</text>
  <text x="36" y="292" font-size="15" fill="#FFB38A">kernel / eBPF</text>
  <!-- boundaries -->
  <line x1="150" y1="130" x2="1170" y2="130" stroke="#C9A7FF" stroke-width="2" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/></line>
  <line x1="150" y1="234" x2="1170" y2="234" stroke="#FF8A5B" stroke-width="2" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/></line>

  <!-- packet 1: stopped at first boundary -->
  <circle cx="330" cy="40" r="7" fill="#BDEBFF"><animate attributeName="cy" values="40;126;126" keyTimes="0;.4;1" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.4;.55;1" dur="5s" repeatCount="indefinite"/></circle>
  <text x="330" y="112" text-anchor="middle" font-size="12" fill="#BDEBFF" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.4;.45;.8;1" dur="5s" repeatCount="indefinite"/>denied</text>
  <!-- packet 2: crosses first, stopped at second -->
  <circle cx="620" cy="40" r="7" fill="#BDEBFF"><animate attributeName="cy" values="40;130;230;230" keyTimes="0;.25;.55;1" dur="5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;.25;.55;.7;1" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
  <text x="620" y="216" text-anchor="middle" font-size="12" fill="#FFB38A" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.5;.58;.85;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>contained</text>
  <!-- packet 3: reaches kernel, observed -->
  <circle cx="910" cy="40" r="7" fill="#FF8A5B"><animate attributeName="cy" values="40;130;234;312;312" keyTimes="0;.25;.5;.8;1" dur="5s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;.25;.5;.8;.92;1" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="910" cy="312" r="8" fill="none" stroke="#FFB38A" stroke-width="2" opacity="0"><animate attributeName="r" values="8;8;34" keyTimes="0;.8;1" dur="5s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.8;.84;1" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle>
  <text x="962" y="316" font-size="12" fill="#FFB38A" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.8;.86;.95;1" dur="5s" begin="2.4s" repeatCount="indefinite"/>observed, logged, written up</text>
  <text x="600" y="362" text-anchor="middle" font-size="13" fill="#9C8FE0">map the boundary  /  state the assumption  /  test it  /  document what happened</text>
</svg>
