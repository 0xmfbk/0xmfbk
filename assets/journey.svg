<text x="1060" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Three ISO lead-auditor</text><text x="1060" y="267" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">certificates in June.</text><text x="1060" y="288" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Joins CyberA4U as</text><text x="1060" y="309" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">cybersecurity instructor.</text>

