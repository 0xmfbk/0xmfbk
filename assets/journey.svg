<text x="600" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Founds DSC YU. Technical</text><text x="600" y="267" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">director of GDSC YU.</text><text x="600" y="288" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">Earns ISC2 CC. Mentors</text><text x="600" y="309" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#CFC4F5">50+ students.</text>
