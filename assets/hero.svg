<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mustafa Bani Khalaf — Security Research Lab</title>
  <desc id="desc">A dark cyber research banner with a glowing cyan grid, terminal panel, and the phrase Every boundary is a hypothesis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="0.58" stop-color="#0b1220"/><stop offset="1" stop-color="#11102b"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset="0.52" stop-color="#a3e635"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f31"/><stop offset="1" stop-color="#0a1220"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".085" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)"/>
  <circle cx="180" cy="90" r="150" fill="#0891b2" opacity=".18" filter="url(#soft)"/>
  <circle cx="1000" cy="340" r="180" fill="#7e22ce" opacity=".16" filter="url(#soft)"/>
  <path d="M0 342 C220 282 333 386 515 320 S830 210 1200 277" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-width="1.5"/>
  <path d="M0 357 C220 297 333 401 515 335 S830 225 1200 292" fill="none" stroke="#a3e635" stroke-opacity=".12" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="54" y="42" width="254" height="30" rx="15" fill="#0b1f2e" stroke="#164e63"/>
    <circle cx="72" cy="57" r="4" fill="#a3e635"/><text x="85" y="62" fill="#9ddced" font-size="12" letter-spacing="2">0XMFBK  /  FIELD NOTES 001</text>
    <text x="54" y="150" fill="#f3f8ff" font-size="67" font-weight="800" letter-spacing="-2">MUSTAFA</text>
    <text x="57" y="204" fill="url(#glow)" font-size="31" font-weight="700" letter-spacing="5">BANI KHALAF</text>
    <rect x="57" y="229" width="388" height="3" rx="1.5" fill="url(#glow)"/>
    <text x="57" y="270" fill="#dbeafe" font-size="17" letter-spacing="1.2">OFFENSIVE SECURITY  /  RUNTIME RESEARCH</text>
    <text x="57" y="299" fill="#94a3b8" font-size="15">DevSecOps · eBPF · Kernel Boundaries · AI Automation</text>
    <text x="57" y="365" fill="#67e8f9" font-size="18" font-weight="700">“Every boundary is a hypothesis.”</text>
    <text x="57" y="391" fill="#64748b" font-size="11" letter-spacing="2">OBSERVE  -&gt;  MODEL  -&gt;  TEST  -&gt;  DOCUMENT</text>
    <g transform="translate(670 70)">
      <rect x="0" y="0" width="466" height="288" rx="14" fill="url(#panel)" stroke="#284056" stroke-width="1.4"/>
      <path d="M0 42H466" stroke="#284056"/>
      <circle cx="22" cy="21" r="5" fill="#fb7185"/><circle cx="40" cy="21" r="5" fill="#fbbf24"/><circle cx="58" cy="21" r="5" fill="#a3e635"/>
      <text x="82" y="25" fill="#64748b" font-size="11" letter-spacing="1.5">research-console — zsh</text>
      <text x="24" y="76" fill="#a3e635" font-size="13">mustafa@lab</text><text x="125" y="76" fill="#67e8f9" font-size="13">:~$</text><text x="160" y="76" fill="#e2e8f0" font-size="13">map --trust-boundaries</text>
      <text x="24" y="111" fill="#64748b" font-size="12">[01]</text><text x="64" y="111" fill="#cbd5e1" font-size="12">application &lt;-&gt; identity</text><text x="321" y="111" fill="#a3e635" font-size="12">inspect</text>
      <text x="24" y="145" fill="#64748b" font-size="12">[02]</text><text x="64" y="145" fill="#cbd5e1" font-size="12">workload &lt;-&gt; runtime</text><text x="321" y="145" fill="#fbbf24" font-size="12">question</text>
      <text x="24" y="179" fill="#64748b" font-size="12">[03]</text><text x="64" y="179" fill="#cbd5e1" font-size="12">container &lt;-&gt; kernel</text><text x="321" y="179" fill="#e879f9" font-size="12">research</text>
      <text x="24" y="213" fill="#64748b" font-size="12">[04]</text><text x="64" y="213" fill="#cbd5e1" font-size="12">signal &lt;-&gt; automation</text><text x="321" y="213" fill="#67e8f9" font-size="12">iterate</text>
      <rect x="22" y="234" width="422" height="34" rx="6" fill="#0a1b28" stroke="#164e63"/>
      <circle cx="39" cy="251" r="4" fill="#a3e635" filter="url(#textGlow)"/><text x="53" y="255" fill="#bae6fd" font-size="12">STATUS: CURIOUS / BUILDING / VERIFYING</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#67e8f9" stroke-opacity=".35"/>
</svg>
